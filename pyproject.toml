[project]
name = "campus-rag-qa"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb",
    "docx2txt>=0.9",
    "langchain",
    "langchain-chroma",
    "langchain-community",
    "langchain-huggingface",
    "openai",
    "pypdf",
    "python-docx",
    "python-dotenv",
    "sentence-transformers",
    "streamlit",
]

[project.scripts]
campus-rag-qa = "campus_rag_qa:main"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
